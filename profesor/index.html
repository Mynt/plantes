<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="profesorTitle">Panel de profesorado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <div id="lang-switch"></div>
    <div class="app-logo"><div class="logo-circle"><img src="../assets/logo-header.png" alt="" /></div></div>
    <p><a href="../" data-i18n="backLink">&larr; Volver</a> · <a href="listados.html" data-i18n="manageListsLink">Gestionar listados</a></p>

    <form id="login-form" class="card">
      <h1 data-i18n="loginHeading">Acceso profesorado</h1>
      <div class="field">
        <label for="email" data-i18n="emailLabel">Email</label>
        <input id="email" type="email" required />
      </div>
      <div class="field">
        <label for="password" data-i18n="passwordLabel">Contraseña</label>
        <input id="password" type="password" required />
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="loginBtn">Entrar</button>
      <p id="login-status" class="muted"></p>
    </form>

    <div id="panel" hidden>
      <div class="card">
        <button id="logout" class="btn btn-secondary" data-i18n="logoutBtn">Cerrar sesión</button>
        <button id="export" class="btn btn-secondary" data-i18n="exportBtn">Exportar JSON</button>
      </div>
      <div id="submissions-list"></div>
    </div>
  </div>

  <script type="module">
    import { renderLangSwitcher } from "../i18n.js";
    renderLangSwitcher(document.getElementById("lang-switch"));
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
