<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="listadosTitle">Listados de referencia — Profesorado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="container">
    <div id="lang-switch"></div>
    <div class="app-logo"><img src="../assets/logo-header.png" alt="" /></div>
    <p><a href="index.html" data-i18n="backToPanelLink">&larr; Panel de corrección</a></p>

    <form id="login-form" class="card">
      <h1 data-i18n="loginHeading">Acceso profesorado</h1>
      <div class="field">
        <label for="email" data-i18n="emailLabel">Email</label>
        <input id="email" type="email" required />
      </div>
      <div class="field">
        <label for="password" data-i18n="passwordLabel">Contraseña</label>
        <input id="password" type="password" required />
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="loginBtn">Entrar</button>
      <p id="login-status" class="muted"></p>
    </form>

    <div id="panel" hidden>
      <form id="new-list-form" class="card">
        <h2 data-i18n="newListHeading">Nuevo listado</h2>
        <div class="field">
          <label data-i18n="listTitleLabel">Título</label>
          <input id="new-title" required />
        </div>
        <div class="field">
          <label data-i18n="explanatoryTextLabel">Texto explicativo para el alumnado</label>
          <textarea id="new-text" rows="3" required></textarea>
        </div>
        <div class="field">
          <label data-i18n="plantNamesLabel">Nombres de planta (uno por línea)</label>
          <textarea id="new-plant-names" rows="4" required data-i18n-placeholder="plantNamesPlaceholder" placeholder="Romero&#10;Tomillo&#10;Lavanda"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="createListBtn">Crear listado</button>
        <p id="new-list-status" class="muted"></p>
      </form>

      <div id="lists-container"></div>
    </div>
  </div>

  <script type="module">
    import { renderLangSwitcher } from "../i18n.js";
    renderLangSwitcher(document.getElementById("lang-switch"));
  </script>
  <script type="module" src="listados.js"></script>
</body>
</html>
